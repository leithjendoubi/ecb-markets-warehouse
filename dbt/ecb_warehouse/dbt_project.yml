name: ecb_warehouse
version: "0.1.0"
config-version: 2
profile: ecb_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

vars:
  # Incremental facts re-process the last N days to pick up ECB revisions (spec §3: 7-day look-back).
  lookback_days: 7
  # Extra history read on incremental runs so window functions (previous rate, 30-day volatility,
  # forward fill) see the same rows as a full refresh.
  window_buffer_days: 90
  # Monthly HICP: re-process the last N months (flash estimates are revised).
  hicp_lookback_months: 12
  # Policy rates: carry a value forward over at most N days without an observation (ADR 0007).
  max_ffill_days: 7

flags:
  send_anonymous_usage_stats: false

models:
  ecb_warehouse:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  ecb_warehouse:
    +schema: staging

snapshots:
  ecb_warehouse:
    +schema: snapshots
