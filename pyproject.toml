[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecb-markets-warehouse"
version = "0.1.0"
description = "Batch ELT pipeline: ECB Data Portal -> S3 (SeaweedFS) -> PostgreSQL -> dbt -> Metabase"
requires-python = ">=3.12,<3.13"
# Exact pins: the same versions are installed on the host (.venv) and in the Airflow image's
# pipeline venv (airflow/Dockerfile), so tests and production run identical code paths.
dependencies = [
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "boto3==1.44.10",
    "psycopg[binary]==3.3.9",
    "pyyaml==6.0.4",
    "dbt-core==1.12.7",
    "dbt-postgres==1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "sqlfluff==4.5.0",
    "sqlfluff-templater-dbt==4.5.0",
    "pre-commit==4.7.0",
]

[project.scripts]
ecb-ingest = "ecb_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["ingestion"]

[tool.setuptools.package-data]
ecb_ingest = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the docker compose stack (make up) running",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dbt/ecb_warehouse/target", "dbt/ecb_warehouse/dbt_packages", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["ecb_ingest"]
